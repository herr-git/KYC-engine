[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kyc-risk-engine"
version = "0.1.0"
description = "Explainable customer risk scoring engine for KYC/AML, built clean-room with synthetic data"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
narrative = ["anthropic>=0.40"]

[project.scripts]
kyc-demo = "kyc_risk_engine.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
